name: Check studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gateway
      # The Cloudflare (JavaScript) worker, including parity with the Python worker.
      - run: npm run test:server
      - run: npm run build
      - run: npm run build:cloudflare && npx wrangler deploy --dry-run --outdir /tmp/cloudflare-check
